const Events = {
  _lastWheel: 0,
  _resizeTimer: null,
  _lastTabClick: null,
  init(){
    document.addEventListener('click', Events.onClick);
    document.addEventListener('input', Events.onInput);
    document.addEventListener('change', Events.onChange);
    document.addEventListener('blur', Events.onBlur, true);
    document.addEventListener('focusin', Events.onFocusIn);
    document.addEventListener('focusout', Events.onFocusOut);
    document.addEventListener('keydown', Events.onKeyDown, true);
    $('main_content').addEventListener('wheel', Events.onWheel, {passive: false});
    window.addEventListener('resize', Events.onResize);
    window.addEventListener('orientationchange', Events.onResize);
    if(window.visualViewport){
      window.visualViewport.addEventListener('resize', Events.onViewportResize, {passive:true});
      window.visualViewport.addEventListener('scroll', Events.onViewportResize, {passive:true});
    }
    window.addEventListener('beforeunload', () => Store.flush());
    window.addEventListener('pagehide', () => Store.flush());
    document.addEventListener('visibilitychange', () => { if(document.hidden) Store.flush(); });
  },
  onClick(e){
    const t = e.target.closest('[data-action]');
    if(!t) return;
    const a = t.dataset.action;

    if(a === 'switch-tab'){
      const idx = +t.dataset.index;
      const now = Date.now();
      if(Events._lastTabClick
        && Events._lastTabClick.idx === idx
        && now - Events._lastTabClick.time < 420){
        Events._lastTabClick = null;
        if(idx < 4){ Events.renameTab(idx); return; }
      }
      Events._lastTabClick = { idx, time: now };
      App.switchTab(idx);
      return;
    }

    switch(a){
      case 'open-log': Modals.openLog(); break;
      case 'open-reset': if(!S.locked) Modals.open('resetModal'); break;
      case 'open-login': Modals.openLogin(); break;
      case 'reset-current': Modals.close('resetModal'); App.resetCurrent(); break;
      case 'reset-all': Modals.close('resetModal'); App.resetAll(); break;
      case 'batch-add-ok': Modals.submitBatchAdd(); break;
      case 'batch-add-cancel': Modals.close('batchAddModal'); break;
      case 'toggle-lock': AdminPanel.toggleLock(); break;
      case 'check-password': Auth.check(); break;
      case 'clear-all-data':
        Modals.askConfirm('清空所有数据', '确定清空所有本地数据吗？\n包括所有模板、批号、密码和排版设置。此操作不可恢复。').then(ok => {
          if(ok){ localStorage.clear(); location.reload(); }
        });
        break;
      case 'close-modal': Modals.close(t.dataset.modal); break;
      case 'confirm-modal-ok': if(Modals._confirmOk) Modals._confirmOk(); break;
      case 'confirm-modal-cancel': if(Modals._confirmCancel) Modals._confirmCancel(); break;
      case 'toggle-empty-slot': App.toggleEmptySlot(+t.dataset.car); break;
      case 'toggle-car-lock': CarLock.toggle(+t.dataset.car); break;
      case 'goto-remark': App.gotoRemark(+t.dataset.car); break;
      case 'scroll-cars': App.scrollCars(+t.dataset.dir); break;
      case 'toggle-collapse': App.toggleCollapse(t); break;
      case 'toggle-opt': App.toggleOpt(t); break;
      case 'toggle-count': e.preventDefault(); App.toggleCount(t.dataset.car); break;
      case 'clear-card': App.clearCard(+t.dataset.car, +t.dataset.s, +t.dataset.i); break;
      case 'switch-admin-tab': AdminPanel.switchTab(t.dataset.tab); break;
      case 'admin-export-all': AdminPanel.exportAll(); break;
      case 'admin-check-calculation': AdminPanel.checkCalculation(); break;
      case 'admin-export-current': AdminPanel.exportCurrent(); break;
      case 'admin-import': AdminPanel.triggerImport(); break;
      case 'admin-clear-template': AdminPanel.clearOneTemplate(+t.dataset.idx); break;
      case 'admin-save-layout': AdminPanel.saveLayout(); break;
      case 'admin-change-pwd': AdminPanel.changePassword(); break;
    }
  },
  renameTab(idx){
    if(idx < 0 || idx >= 4) return;
    if(S.locked){ alert('系统已锁定，无法修改模板名称'); return; }
    const def = defaultTabName(idx);
    const cur = S.tabNames[idx] || def;
    const input = prompt(`修改「${def}」名称：\n（留空则恢复默认「${def}」）`, cur);
    if(input === null) return;
    const nv = String(input).trim();
    S.tabNames[idx] = nv ? nv : def;
    Store.saveTabNames();
    Renderer.initTabs();
    Renderer.updateActiveTab();
  },
  onInput(e){
    const el = e.target;
    const role = el.dataset.role;
    AutoSize.byId(el);
    if(role === 'batch') return;
    if(S.locked) return;
    if(role === 'start'){
      el._dirty = true;
      delete T()[fk.autoFill(+el.dataset.car, +el.dataset.s)];
      Sync.rowToB_F(pref(+el.dataset.car), +el.dataset.s, true);
      return;
    }
    if(role === 'title'){ Events.onTitleInput(el); return; }
    if(role === 'row'){ Sync.rowToB_F(pref(+el.dataset.car), +el.dataset.s, true); Store.saveDebounced(); return; }
    if(role === 'header'){ Events.onHeaderInput(el); return; }
  },
  onTitleInput(el){
    const c = +el.dataset.car, s = +el.dataset.s;
    const v = pref(c);
    delete T()[fk.autoFill(c, s)];
    if(c === 0){ syncTitleFromV0(el.value, s); }
    else {
      const v0El = $(`title_v0_s${s}_i1`);
      const v0Val = v0El ? v0El.value.trim() : '';
      Flags.titleCustom(c, s, v0Val !== el.value.trim());
      Sync.titles(v, s);
    }
    if(!isManualOnlyTab()) Scheduler.updateAllDebounced();
    Store.saveDebounced();
  },
  onHeaderInput(el){
    const field = el.dataset.field;
    const id = el.id || '';
    const m = id.match(/^[a-zA-Z_]+_v(\d+)/);
    const carIdx = m ? +m[1] : -1;
    if(field === 'processTime' && carIdx === 0){
      syncHeaderFieldFromV0('processTime', el.value);
      if(!isManualOnlyTab()) Scheduler.updateAllDebounced();
      Store.saveDebounced();
      return;
    }
    if((field === 'series1' || field === 'series2') && carIdx === 0){
      syncHeaderFieldFromV0(field, el.value); Store.saveDebounced(); return;
    }
    if(field === 'denier' && carIdx === 0){
      syncHeaderFieldFromV0('denier', el.value); Store.saveDebounced(); return;
    }
    if(field === 'headerName' && carIdx === 0){
      syncHeaderFieldFromV0('headerName', el.value); Store.saveDebounced(); return;
    }
    Store.saveDebounced();
  },
  onChange(e){
    if(e.target.dataset.role === 'batch') Batch.handleChange(e.target);
  },
  onBlur(e){
    const el = e.target;
    AutoSize.byId(el);
    const role = el.dataset.role;
    if(S.locked) return;
    if(role === 'start'){ Events.onStartBlur(el); return; }
    if(role === 'title'){ Events.onTitleBlur(el); return; }
    if(role === 'header'){
      if(el.dataset.field === 'processTime' && el.id === 'processTime_v0'){
        const raw = el.value.trim();
        if(raw && !U.isValidDurationInput(raw)){
          showToast('时间错误：小时须在 0-23 之间，分钟和秒须在 0-59 之间。');
          el.value = '';
        } else {
          el.value = U.autoFormatDuration(raw);
        }
        syncHeaderFieldFromV0('processTime', el.value);
        if(!isManualOnlyTab()){ Scheduler.updateAll(); AutoSize.allHeaders(); }
      }
      Store.save();
      return;
    }
    if(role === 'remark' || role === 'row') Store.save();
  },
  onStartBlur(el){
    if(el.readOnly) return;
    const raw = el.value.trim();
    if(raw && !U.isValidClockInput(raw)){
      showToast('时间错误：小时须在 0-23 之间，分钟须在 0-59 之间。');
      el.value = '';
    } else {
      el.value = U.autoFormat(raw);
    }
    if(el._dirty){
      const v = el.value.trim();
      const c = +el.dataset.car, s = +el.dataset.s;
      if(v && U.toSec(v) !== null){ Flags.manualStart(c, s, true); Flags.manualClear(c, s, false); }
      else { Flags.manualStart(c, s, false); Flags.manualClear(c, s, true); }
      el._dirty = false;
    }
    if(!isManualOnlyTab()) Scheduler.updateAll();
  },
  onTitleBlur(el){
    if(el.readOnly) return;
    const c = +el.dataset.car, s = +el.dataset.s;
    const formatted = U.formatTitle(el.value);
    if(formatted === el.value) return;
    el.value = formatted;
    if(c === 0){ syncTitleFromV0(formatted, s); }
    else { Sync.titles(pref(c), s); }
    if(!isManualOnlyTab()) Scheduler.updateAll();
    Store.save();
  },
  onFocusIn(e){
    const el = e.target;
    if(el.classList && el.classList.contains('calc-input') && !el.readOnly){
      setTimeout(() => { try{ el.select(); }catch(_e){} }, 10);
    }
    if(window.innerWidth < 768){
      if(S.kbOpen) return;
      if(!U.isEditable(el)) return;
      S.kbOpen = true;
      document.body.classList.add('keyboard-open');
      const container = $('main_content');
      if(container){
        S.preKbH = container.clientHeight;
        container.style.overflowAnchor = 'none';
      }
      // 等手机键盘完成弹出后，按可视区域缩小内容区，并把当前输入框滚动到可见位置。
      [120, 300, 500].forEach(delay => setTimeout(() => Events.keepFocusedInputVisible(el), delay));
    }
  },
  keepFocusedInputVisible(el){
    if(!el || document.activeElement !== el || !U.isEditable(el)) return;
    const container = $('main_content');
    if(container && window.visualViewport && S.kbOpen){
      const rect = container.getBoundingClientRect();
      const visibleBottom = window.visualViewport.height + window.visualViewport.offsetTop;
      const available = Math.max(160, visibleBottom - rect.top - 8);
      container.style.height = available + 'px';
    }
    // 手机端不要调用 element.scrollIntoView()：它可能滚动整个文档，
    // 导致当前车辆输入时上一辆车被带入视野。只在主内容滚动容器内做最小调整。
    setTimeout(() => {
      if(document.activeElement !== el) return;
      const c = $('main_content');
      if(!c) return;
      const r = el.getBoundingClientRect();
      const cr = c.getBoundingClientRect();
      const vv = window.visualViewport;
      const bottom = vv ? Math.min(cr.bottom, vv.height + vv.offsetTop) : Math.min(cr.bottom, window.innerHeight);
      const top = Math.max(cr.top, 4);
      if(r.bottom > bottom - 12){
        c.scrollTop += Math.min(r.bottom - bottom + 18, Math.max(0, c.scrollHeight - c.clientHeight));
      } else if(r.top < top + 4){
        c.scrollTop -= Math.min(top + 4 - r.top, c.scrollTop);
      }
    }, 80);
  },
  onViewportResize(){
    if(!S.kbOpen) return;
    const el = document.activeElement;
    if(U.isEditable(el)) Events.keepFocusedInputVisible(el);
  },
  onFocusOut(e){
    if(window.innerWidth >= 768) return;
    if(!U.isEditable(e.target)) return;
    setTimeout(() => {
      if(U.isEditable(document.activeElement)) return;
      if(!S.kbOpen) return;
      S.kbOpen = false;
      document.body.classList.remove('keyboard-open');
      const container = $('main_content');
      if(container){ container.style.height = ''; container.style.overflowAnchor = ''; }
      Layout.adjustCarHeightsThrottled();
    }, 120);
  },
  onKeyDown(e){
    const t = e.target;
    if(!t) return;
    if(t.id === 'batchAddName' || t.id === 'batchAddDenier' || t.id === 'batchAddPT' || t.id === 'batchAddCount'){
      if(e.key === 'Enter'){ e.preventDefault(); Modals.submitBatchAdd(); }
      return;
    }
    if(t.id === 'adminPassword' && e.key === 'Enter'){
      e.preventDefault(); Auth.check(); return;
    }
    if(!t.classList || !t.classList.contains('calc-input')) return;
    if(e.key !== 'Enter' && e.keyCode !== 13 && e.which !== 13) return;
    if(e.isComposing || e.keyCode === 229) return;
    if(t.tagName === 'TEXTAREA' || t.readOnly || t.disabled) return;
    const id = t.id || '';
    // 工艺时间按回车时执行失焦校验与格式化，不把回车吞掉。
    if(/^processTime_v\d+$/.test(id)){
      e.preventDefault();
      t.blur();
      return;
    }
    let m, targetId = null;
    if((m = id.match(/^start_(v\d+)_s(\d+)_i1$/))) targetId = Events.nextRowId('start', m[1], +m[2]);
    else if((m = id.match(/^train_(v\d+)_s(\d+)_i1$/))) targetId = 'shift_' + m[1] + '_s' + m[2] + '_i1';
    else if((m = id.match(/^shift_(v\d+)_s(\d+)_i1$/))) targetId = Events.nextRowId('train', m[1], +m[2]);
    else return;
    e.preventDefault();
    if(!targetId){ t.blur(); return; }
    const next = $(targetId);
    if(!next || next.disabled || next.readOnly){ t.blur(); return; }
    const block = next.closest ? next.closest('.car-block') : null;
    if(block && block.classList.contains('collapsed')){
      block.classList.remove('collapsed');
      const btn = block.querySelector('.toggle-btn');
      if(btn) btn.textContent = '折叠';
      T()[`collapse_${block.id}`] = false;
      Store.saveDebounced();
      Layout.adjustCarHeightsThrottled();
    }
    next.focus();
    if(block){
      const container = $('main_content');
      if(container){
        const top = block.offsetTop - container.offsetTop;
        requestAnimationFrame(() => {
          if(Math.abs(container.scrollTop - top) > 8) container.scrollTop = top;
        });
      }
    }
    if(window.innerWidth >= 768 && next.select){
      setTimeout(() => { try{ next.select(); }catch(_e){} }, 0);
    }
  },
  nextRowId(kind, vPrefix, sIdx){
    if(sIdx + 1 < CFG.SUBS) return `${kind}_${vPrefix}_s${sIdx+1}_i1`;
    return null;
  },
  onWheel(e){
    if(window.innerWidth < 768) return;
    if(U.isEditable(e.target)) return;
    if(Math.abs(e.deltaY) < 4) return;
    e.preventDefault();
    const now = Date.now();
    if(now - Events._lastWheel < 90) return;
    Events._lastWheel = now;
    App.scrollCars(e.deltaY > 0 ? 1 : -1);
  },
  onResize(){
    clearTimeout(Events._resizeTimer);
    Events._resizeTimer = setTimeout(() => {
      if(!S.kbOpen) Layout.adjustCarHeightsThrottled();
      AutoSize.allHeaders();
    }, 150);
  }
};

<script>
(()=> {
const $=id=>document.getElementById(id);
const recordsKey='luotong_fault_records_v1', reasonsKey='luotong_fault_reasons_v1';
const memStore=Object.create(null);
const safeStore={getItem(k){try{return window.localStorage.getItem(k)}catch(e){return Object.prototype.hasOwnProperty.call(memStore,k)?memStore[k]:null}},setItem(k,v){try{window.localStorage.setItem(k,v)}catch(e){memStore[k]=String(v)}}};
const rollValues=[8,48,60];let rollIndex=0;
for(let i=1;i<=24;i++){const o=document.createElement('option');o.value=String(i);o.textContent=String(i);$('position').append(o)}
function localDateTime(d=new Date()){const pad=n=>String(n).padStart(2,'0');return \`\${d.getFullYear()}-\${pad(d.getMonth()+1)}-\${pad(d.getDate())}T\${pad(d.getHours())}:\${pad(d.getMinutes())}\`}
document.querySelectorAll('[data-now]').forEach(b=>b.addEventListener('click',()=>{$(b.dataset.now).value=localDateTime();$(b.dataset.now).dispatchEvent(new Event('change',{bubbles:true}))}));
function paintToggle(el){const yes=el.dataset.value==='是';el.textContent=(yes?'✓':'✕')+' '+(yes?'是':'否');el.classList.toggle('active',yes);el.style.background=yes?'#e5f8ed':'#fff0ef';el.style.borderColor=yes?'#8ed6ab':'#f2b8b5';el.style.color=yes?'#168348':'#c43c36'}
function setupToggle(id){const el=$(id);paintToggle(el);el.addEventListener('click',()=>{el.dataset.value=el.dataset.value==='是'?'否':'是';paintToggle(el)})}
setupToggle('inspection');setupToggle('trace');
$('rollToggle').addEventListener('click',()=>{rollIndex=(rollIndex+1)%rollValues.length;$('smallRolls').value=rollValues[rollIndex];$('rollToggle').textContent='切换：'+rollValues[rollIndex]});
function getReasons(){try{return JSON.parse(safeStore.getItem(reasonsKey)||'[]')}catch{return []}}
function saveReasons(list){safeStore.setItem(reasonsKey,JSON.stringify(list))}
function populateReasons(){const s=$('reason'),v=s.value;[...s.querySelectorAll('option[data-custom="1"]')].forEach(o=>o.remove());getReasons().forEach(r=>{const o=document.createElement('option');o.value=r;o.textContent=r;o.dataset.custom='1';s.append(o)});if([...s.options].some(o=>o.value===v))s.value=v}
function openReasonModal(){$('reasonModal').classList.add('active');$('reasonModal').setAttribute('aria-hidden','false');$('customReason').value='';$('customReason').focus()}
function closeReasonModal(){$('reasonModal').classList.remove('active');$('reasonModal').setAttribute('aria-hidden','true')}
$('reason').addEventListener('change',()=>{if($('reason').value==='__add__'){openReasonModal();$('reason').value=''}});

$('reason').insertAdjacentHTML('beforeend','<option value="__add__">＋ 添加选项…</option>');
$('cancelReason').addEventListener('click',closeReasonModal);
$('reasonModal').addEventListener('click',e=>{if(e.target===$('reasonModal'))closeReasonModal()});
$('saveReason').addEventListener('click',()=>{const v=$('customReason').value.trim();if(!v)return alert('请先输入故障位置/原因');if(['并丝','断丝',...getReasons()].includes(v))return alert('该选项已存在');saveReasons([...getReasons(),v]);populateReasons();$('reason').value=v;closeReasonModal()});
$('customReason').addEventListener('keydown',e=>{if(e.key==='Enter')$('saveReason').click();if(e.key==='Escape')closeReasonModal()});
function loadRecords(){try{return JSON.parse(safeStore.getItem(recordsKey)||'[]')}catch{return []}}

function installFaultTemplateTab(){
  const tabs = document.getElementById('main-tabs');
  if(!tabs || document.getElementById('fault-template-tab')) return;
  const tab = document.createElement('div');
  tab.className = 'main-tab';
  tab.id = 'fault-template-tab';
  tab.textContent = '🛠 故障记录';
  tab.title = '打开故障记录模板';
  tab.addEventListener('click', openFaultTemplate);
  tabs.appendChild(tab);
  const panel = document.createElement('div');
  panel.id = 'fault-template-panel';
  panel.style.cssText = 'display:none;height:calc(100vh - 52px);height:calc(100dvh - 52px);overflow:hidden;background:#f3f5f9;';
  const frame = document.createElement('iframe');
  frame.title = '落筒故障录入';
  frame.style.cssText = 'display:block;width:100%;height:100%;border:0;background:#f3f5f9;';
  frame.setAttribute('sandbox','allow-scripts allow-forms allow-same-origin allow-modals');
  frame.srcdoc = FAULT_TEMPLATE_HTML;
  panel.appendChild(frame);
  const main = document.getElementById('main-contents');
  main.parentNode.insertBefore(panel, main.nextSibling);
  document.addEventListener('click', function(e){
    const clickedTab = e.target.closest('.main-tab');
    if(clickedTab && clickedTab.id !== 'fault-template-tab'){
      panel.style.display = 'none';
      main.style.display = '';
      tab.classList.remove('active');
    }
  }, true);
}
function openFaultTemplate(){
  const panel = document.getElementById('fault-template-panel');
  const main = document.getElementById('main-contents');
  const tab = document.getElementById('fault-template-tab');
  if(!panel || !main || !tab) return;
  main.style.display = 'none';
  panel.style.display = 'block';
  document.querySelectorAll('#main-tabs .main-tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
}

// 车次仅在按回车时拆分；不在输入过程中自动处理。
function splitTrainOnEnter(input){
  const m = input.id.match(/^train_(v\d+)_s(\d+)_i(\d+)$/);
  if(!m) return false;
  const raw = String(input.value || '').trim();
  const shift = document.getElementById('shift_' + m[1] + '_s' + m[2] + '_i' + m[3]);
  // 当前车最下面一排回车后只失焦，不跳到下一车；其他排跳到下一个位号车次框。
  const sameCarTrainInputs = Array.from(document.querySelectorAll('input[id^="train_"]'))
    .map(el => ({el, match: el.id.match(/^train_(v\d+)_s(\d+)_i(\d+)$/)}))
    .filter(item => item.match && item.match[1] === m[1] && item.match[3] === m[3])
    .map(item => Number(item.match[2]));
  const maxRowIndex = sameCarTrainInputs.length ? Math.max(...sameCarTrainInputs) : -1;
  const isLastRow = Number(m[2]) === maxRowIndex;
  if(!raw){
    if(isLastRow) input.blur();
    else focusNextTrainInput(input);
    return true;
  }
  if(!/^\d+$/.test(raw)){
    input.value = '';
    if(shift) shift.value = '';
    Store.saveDebounced();
    showToast('车次输入不合法，请输入数字');
    input.focus();
    return true;
  }
  const finalTrain = raw.slice(0, -1);
  const last = Number(raw.slice(-1));
  if(!Number.isInteger(last) || last < 1 || last > 4){
    clearInvalidTrain(input, shift, '班次不合法，仅支持1-4的班次值');
    return true;
  }
  if(finalTrain !== ''){
    const trainNumber = Number(finalTrain);
    if(!Number.isInteger(trainNumber) || trainNumber < 1 || trainNumber > 15){
      clearInvalidTrain(input, shift, '拆分后的车次不合法，请输入1-15范围内的车次');
      return true;
    }
  }
  if(shift) shift.value = String(last);
  input.value = finalTrain;
  Store.saveDebounced();
  // 当前车最下面一排拆分完成后失焦；不跳到下一车。其他排跳到下一个位号车次框。
  if(isLastRow) input.blur();
  else focusNextTrainInput(input);
  return true;
}
function focusNextTrainInput(currentInput){
  // 按页面 DOM 顺序跳到下一个位号的车次输入框，不跳到当前位号的其他字段。
  const all = Array.from(document.querySelectorAll('input[id^="train_"]'))
    .filter(el => !el.disabled && !el.readOnly && el.type !== 'hidden');
  const currentIndex = all.indexOf(currentInput);
  if(currentIndex < 0) return;
  const next = all[currentIndex + 1];
  if(next){
    next.focus({preventScroll:false});
    try{ next.select(); }catch(_e){}
    if(typeof Events !== 'undefined' && Events.keepFocusedInputVisible) Events.keepFocusedInputVisible(next);
  }else{
    currentInput.focus();
  }
}
function clearInvalidTrain(input, shift, message){
  input.value = '';
  if(shift) shift.value = '';
  Store.saveDebounced();
  showToast(message);
  input.focus();
}
function focusNextOccupiedTrain(currentInput){
  // 合法拆分后直接跳到 DOM 顺序中的下一个可编辑位号车次输入框，不检查内容。
  setTimeout(function(){
    const all = Array.from(document.querySelectorAll('input[id^="train_"]'));
    const currentIndex = all.indexOf(currentInput);
    if(currentIndex < 0) return;
    for(let i=currentIndex+1; i<all.length; i++){
      const candidate = all[i];
      if(candidate.disabled || candidate.readOnly) continue;
      candidate.focus({preventScroll:false});
      try{ candidate.select(); }catch(_e){}
      if(typeof Events !== 'undefined' && Events.keepFocusedInputVisible) Events.keepFocusedInputVisible(candidate);
      return;
    }
  }, 80);
}
// 使用捕获阶段拦截车次输入框的回车：拆分后跳到下一个位号的车次输入框。
document.addEventListener('keydown', function(e){
  const input = e.target;
  if(e.key !== 'Enter' && e.keyCode !== 13 && e.which !== 13) return;
  if(e.isComposing || e.keyCode === 229) return;
  if(!input || !input.id || !/^train_v\d+_s\d+_i\d+$/.test(input.id)) return;
  if(input.readOnly || input.disabled) return;
  e.preventDefault();
  e.stopImmediatePropagation();
  splitTrainOnEnter(input);
}, true);

boot();
})();
