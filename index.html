const RemarkNav = {};

const App = {
  switchTab(index){
    if(S.tab === index) return;
    Store.flush();
    const container = $('main_content');
    S.scroll[S.tab] = container.scrollTop;
    // 记录当前模板视口内最靠近顶部的车辆，避免不同模板高度不同导致只恢复滚动像素后车辆显示不全。
    if(container){
      const cr = container.getBoundingClientRect();
      const blocks = [...container.querySelectorAll('.one-car-block')];
      let anchor = blocks.find(b => { const r=b.getBoundingClientRect(); return r.bottom > cr.top + 2; }) || blocks[0];
      if(anchor){
        const idx = blocks.indexOf(anchor);
        S.scrollAnchor[S.tab] = { car: idx, offset: anchor.getBoundingClientRect().top - cr.top };
      }
    }
    document.querySelectorAll('.fullscreen-car').forEach(el => el.classList.remove('fullscreen-car'));
    document.body.classList.remove('car-fullscreen-active');
    S.tab = index;
    Renderer.updateActiveTab();
    App.loadTab();
    Auth.applyLockState();
    Layout.adjustCarHeightsThrottled();
    // 等模板 DOM 与车辆高度完成更新后，再按车辆锚点恢复；多次校正兼容手机浏览器的异步布局。
    const restorePosition = () => {
      const anchor = S.scrollAnchor[index];
      const blocks = [...container.querySelectorAll('.one-car-block')];
      if(anchor && blocks[anchor.car]){
        const target = blocks[anchor.car];
        const offset = Number.isFinite(anchor.offset) ? anchor.offset : 0;
        container.scrollTop += target.getBoundingClientRect().top - container.getBoundingClientRect().top - offset;
      }else{
        container.scrollTop = Number.isFinite(S.scroll[index]) ? S.scroll[index] : 0;
      }
    };
    requestAnimationFrame(() => { restorePosition(); requestAnimationFrame(restorePosition); });
    setTimeout(restorePosition, 120);
    setTimeout(restorePosition, 320);
  },
  loadTab(){
    document.querySelectorAll('.fullscreen-car').forEach(el => el.classList.remove('fullscreen-car'));
    document.body.classList.remove('car-fullscreen-active');
    const d = T();
    for(let c = 0; c < CFG.CARS; c++){
      const v = pref(c);
      const block = $(`block_${v}`);
      if(!block) continue;
      const collapsed = !!d[`collapse_block_${v}`];
      block.classList.toggle('collapsed', collapsed);
      const btn = block.querySelector('.toggle-btn');
      if(btn) btn.textContent = collapsed ? '展开' : '折叠';
    }
    getAllFields().forEach(el => {
      if(el.id && !el.id.startsWith('setting') && el.id !== 'adminPassword'){
        el.value = d[el.id] !== undefined ? d[el.id] : '';
      }
    });
    // F/G、A/B 是按钮状态，不是表单字段；按当前模板单独恢复，避免切换模板串值。
    for(let c = 0; c < CFG.CARS; c++){
      const block = $(`block_v${c}`);
      if(!block) continue;
      block.querySelectorAll('.opt-btn[data-type]').forEach(btn => {
        const key = `opt_${btn.dataset.type}_v${c}`;
        const activeText = d[key];
        if(activeText){
          btn.textContent = activeText;
          btn.classList.toggle('alt', (btn.dataset.type === 'fg' && activeText === 'G') || (btn.dataset.type === 'ab' && activeText === 'B'));
        } else {
          btn.textContent = btn.dataset.type === 'fg' ? 'F' : 'A';
          btn.classList.remove('alt');
        }
      });
    }
    $$('.left-title-input').forEach(el => {
      if(el.value && el.value.trim()){
        const f = U.formatTitle(el.value);
        if(f !== el.value) el.value = f;
      }
    });
    for(let c = 0; c < CFG.CARS; c++){
      for(let s = 0; s < CFG.SUBS; s++) Sync.titles(pref(c), s);
    }
    Batch.refreshSelects();
    const savedBatch = d['batch_v0'] || '';
    if(savedBatch && S.batchOpts.includes(savedBatch)) Batch.applyAll(savedBatch, true, true, true);
    else Batch.applyAll('', true, true, true);
    CarLock.applyAll();
    Renderer.updateEmptySlotBtns();
    // 切模板不重算：保留各模板已录入的时间与空位结果
    Layout.adjustCarHeightsThrottled();
    AutoSize.allHeaders();
    updateCountWarnings();
    updateTitleCustomMarks();
  },
  toggleEmptySlot(carIdx){
    if(S.locked) return;
    if(isManualOnlyTab()) return;
    if(CarLock.isLocked(carIdx)) return;
    const newVal = !Flags.emptyFill(carIdx);
    if(carIdx === 0){ for(let c = 0; c < CFG.CARS; c++) Flags.emptyFill(c, newVal); }
    else { Flags.emptyFill(carIdx, newVal); }
    Renderer.updateEmptySlotBtns();
    Scheduler.updateFrom(carIdx);
    Store.save();
  },
  gotoRemark(carIdx){
    if(S.locked) return;
    if(CarLock.isLocked(carIdx)) return;
    const container = $('main_content');
    const v = pref(carIdx);
    const block = $(`block_${v}`);
    if(!block || !container) return;
    let wasCollapsed = false;
    if(block.classList.contains('collapsed')){
      block.classList.remove('collapsed');
      const btn = block.querySelector('.toggle-btn');
      if(btn) btn.textContent = '折叠';
      T()[`collapse_${block.id}`] = false;
      Store.saveDebounced();
      wasCollapsed = true;
    }
    const doScroll = () => {
      const grid = $(`grid_${v}_s0`);
      const maxLeft = grid ? Math.max(0, grid.scrollWidth - grid.clientWidth) : 0;
      const nav = RemarkNav[carIdx] || (RemarkNav[carIdx] = {until: 0, target: null});
      const now = Date.now();
      let goRight;
      if(now < nav.until && nav.target){ goRight = nav.target !== 'right'; }
      else { const atRight = maxLeft > 0 && grid && grid.scrollLeft >= maxLeft - 12; goRight = !atRight; }
      nav.until = now + 600;
      nav.target = goRight ? 'right' : 'left';
      container.style.scrollSnapType = 'none';
      const top = block.offsetTop - container.offsetTop;
      container.scrollTo({top, behavior: 'smooth'});
      setTimeout(() => {
        container.style.scrollSnapType = '';
        if(!grid) return;
        grid.style.scrollSnapType = 'none';
        const targetLeft = goRight ? maxLeft : 0;
        grid.scrollTo({left: targetLeft, behavior: 'smooth'});
        setTimeout(() => { grid.style.scrollSnapType = ''; }, 300);
      }, 300);
    };
    if(wasCollapsed){ Layout.adjustCarHeights(); setTimeout(doScroll, 20); }
    else { doScroll(); }
  },
  scrollCars(dir){
    const container = $('main_content');
    if(!container) return;
    const blocks = Array.from(container.querySelectorAll('.car-block'));
    if(!blocks.length) return;
    let baseIdx;
    if(S.navIdx !== null && S.navIdx >= 0 && S.navIdx < blocks.length) baseIdx = S.navIdx;
    else baseIdx = App.nearestBlock(container, blocks);
    const target = Math.min(blocks.length-1, Math.max(0, baseIdx + dir));
    S.navIdx = target;
    if(S.navTimer) clearTimeout(S.navTimer);
    S.navTimer = setTimeout(() => { S.navIdx = null; }, 450);
    const top = blocks[target].offsetTop - container.offsetTop;
    container.scrollTo({top, behavior: 'smooth'});
  },
  nearestBlock(container, blocks){
    const ct = container.getBoundingClientRect().top;
    let idx = 0, min = Infinity;
    blocks.forEach((b, i) => {
      const d = Math.abs(b.getBoundingClientRect().top - ct);
      if(d < min){ min = d; idx = i; }
    });
    return idx;
  },
  toggleCollapse(btn){
    const block = btn.closest('.one-car-block');
    if(!block) return;
    const id = block.id;
    const collapsed = block.classList.contains('collapsed');
    const container = $('main_content');
    if(!container) return;
    const blocks = Array.from(container.querySelectorAll('.one-car-block'));
    const index = blocks.indexOf(block);
    const nextBlock = index >= 0 ? blocks[index + 1] : null;
    // 移动端的强制滚动吸附可能覆盖 scrollTo；滚动期间暂时关闭，结束后恢复。
    container.style.scrollSnapType = 'none';
    if(collapsed){
      block.classList.remove('collapsed');
      btn.textContent = '折叠';
      T()[`collapse_${id}`] = false;
      Layout.adjustCarHeightsThrottled();
      requestAnimationFrame(() => requestAnimationFrame(() => {
        const top = block.getBoundingClientRect().top - container.getBoundingClientRect().top + container.scrollTop;
        container.scrollTo({top: Math.max(0, top), behavior: 'auto'});
        setTimeout(() => { container.style.scrollSnapType = ''; }, 350);
      }));
    } else {
      block.classList.add('collapsed');
      btn.textContent = '展开';
      T()[`collapse_${id}`] = true;
      Layout.adjustCarHeightsThrottled();
      requestAnimationFrame(() => requestAnimationFrame(() => {
        const target = nextBlock || block;
        const top = target.getBoundingClientRect().top - container.getBoundingClientRect().top + container.scrollTop;
        container.scrollTo({top: Math.max(0, top), behavior: 'auto'});
        setTimeout(() => { container.style.scrollSnapType = ''; }, 350);
      }));
    }
    Store.saveDebounced();
  },
  toggleOpt(btn){
    if(S.locked) return;
    const blk = btn.closest('.car-block');
    if(blk){
      const m = blk.id.match(/^block_v(\d+)$/);
      if(m && CarLock.isLocked(+m[1])) return;
    }
    if(btn.dataset.type === 'fg'){
      btn.textContent = btn.textContent === 'F' ? 'G' : 'F';
      btn.classList.toggle('alt');
    } else if(btn.dataset.type === 'ab'){
      btn.textContent = btn.textContent === 'A' ? 'B' : 'A';
      btn.classList.toggle('alt');
    }
    const m = blk && blk.id.match(/^block_v(\d+)$/);
    if(m && btn.dataset.type) T()[`opt_${btn.dataset.type}_v${m[1]}`] = btn.textContent;
    Store.saveDebounced();
  },
  toggleCount(carIdx){
    if(S.locked) return;
    if(CarLock.isLocked(+carIdx)) return;
    const v = pref(+carIdx);
    const el = $(`count_${v}`);
    if(!el) return;
    const cur = el.value.trim();
    if(cur === '288') el.value = '48';
    else el.value = '288';
    AutoSize.byId(el);
    Store.saveDebounced();
  },
  clearCard(carIdx, sIdx, colNum){
    if(S.locked) return;
    if(CarLock.isLocked(carIdx)) return;
    const v = pref(carIdx);
    if(colNum === 1){
      [`start_${v}_s${sIdx}_i1`, `shift_${v}_s${sIdx}_i1`, `train_${v}_s${sIdx}_i1`, `name_${v}_s${sIdx}_i1`].forEach(id => { const el = $(id); if(el) el.value = ''; });
      Flags.manualStart(carIdx, sIdx, false);
      const titleEl = $(`title_${v}_s${sIdx}_i1`);
      Flags.manualClear(carIdx, sIdx, !!(titleEl && titleEl.value.trim()));
      const afKey = fk.autoFill(carIdx, sIdx);
      delete T()[afKey];
      Sync.titles(v, sIdx);
    } else {
      [`time_${v}_s${sIdx}_i${colNum}`, `shift_${v}_s${sIdx}_i${colNum}`, `train_${v}_s${sIdx}_i${colNum}`, `name_${v}_s${sIdx}_i${colNum}`].forEach(id => { const el = $(id); if(el) el.value = ''; });
    }
    Sync.dates();
    Store.saveDebounced();
    updateTitleCustomMarks();
  },
  resetCurrent(){
    if(S.locked) return;
    clearFaultTemplateData();
    S.data[S.tab] = {};
    getAllFields().forEach(el => {
      if(el.id && !el.id.startsWith('setting') && el.id !== 'adminPassword') el.value = '';
    });
    const d = S.data[S.tab];
    resetBatchBaseDate(S.tab);
    for(let c = 0; c < CFG.CARS; c++){
      const v = pref(c);
      d[`date_${v}`] = todayStr;
      for(let s = 0; s < CFG.SUBS; s++){
        for(let i = 1; i <= 6; i++){
          d[`title_${v}_s${s}_i${i}`] = S.tab <= 3 ? ((6-s + S.tab*6) + '#') : '';
        }
      }
    }
    if(S.tab < 4){
      S.tabNames[S.tab] = defaultTabName(S.tab);
      Store.saveTabNames();
      Renderer.initTabs();
      installFaultTemplateTab();
      Renderer.updateActiveTab();
    }
    App.loadTab();
    Store.save();
  },
  resetAll(){
    if(S.locked) return;
    clearFaultTemplateData();
    S.data = Array.from({length: CFG.TEMPLATES}, () => ({}));
    for(let t = 0; t < CFG.TEMPLATES; t++) resetBatchBaseDate(t);
    getAllFields().forEach(el => {
      if(el.id && !el.id.startsWith('setting') && el.id !== 'adminPassword') el.value = '';
    });
    for(let t = 0; t < 4; t++) S.tabNames[t] = defaultTabName(t);
    Store.saveTabNames();
    Renderer.initTabs();
    installFaultTemplateTab();
    Renderer.updateActiveTab();
    Store.initDefaults();
    App.loadTab();
    Store.save();
  }
};

const Modals = {

  _confirmCancel: null,
  open(id){ $(id).classList.add('active'); },

  /* 打开自定义批号弹窗并清空各字段 */

  /* 校验并保存自定义批号，刷新各车头批号下拉 */

const Auth = {
  check(){
    if($('adminPassword').value === AdminPassword.get()){
      Modals.close('loginModal');
      AdminPanel.open();
    } else {
      $('loginError').style.display = 'block';
    }
  },
  toggleLock(){
    S.locked = !S.locked;
    localStorage.setItem(CFG.KEY.LOCKED, S.locked);
    Auth.applyLockState();
  },
  applyLockState(){
    const banner = $('lockBanner');
    const btn = $('lockToggleBtn');
    const inputs = $$('input, textarea, select');
    const optBtns = $$('.opt-btn');
    document.body.classList.toggle('locked', S.locked);
    if(S.locked){
      if(banner) banner.classList.add('active');
      if(btn){ btn.innerText = '🔓 解锁系统'; btn.className = 'admin-btn success'; }
      inputs.forEach(el => {
        if(el.id !== 'adminPassword' && !el.id.startsWith('setting') && !el.id.startsWith('batchAdd') && !el.id.startsWith('newPassword') && !el.id.startsWith('confirmPassword')){
          el.disabled = true;
          if(!el.readOnly) el.style.backgroundColor = '#e9ecef';
        }
      });
      optBtns.forEach(b => b.disabled = true);
    } else {
      if(banner) banner.classList.remove('active');
      if(btn){ btn.innerText = '🔒 锁定系统'; btn.className = 'admin-btn danger'; }
      inputs.forEach(el => {
        el.disabled = false;
        if(!el.readOnly) el.style.backgroundColor = '';
      });
      optBtns.forEach(b => b.disabled = false);
    }
    CarLock.applyAll();
    Renderer.updateEmptySlotBtns();
  }
};

const AdminPanel = {
  open(){
    AdminPanel.switchTab('overview');
    AdminPanel.renderAll();
    Modals.open('adminPanelModal');
  },
  switchTab(tab){
    $$('.admin-tab').forEach(el => el.classList.toggle('active', el.dataset.tab === tab));
    $$('.admin-pane').forEach(el => el.classList.toggle('active', el.dataset.pane === tab));
  },
  renderAll(){
    AdminPanel.renderStats();
    AdminPanel.renderTemplateList();
    AdminPanel.fillSettings();
  },
  _hasTime(d, v, s){
    const t = (d[`start_${v}_s${s}_i1`] || '').trim();
    return t !== '';
  },
  renderStats(){
    let totalFilled = 0, totalCells = 0, batchCount = 0;
    const rows = S.data.map((d, idx) => {
      let filled = 0, total = 0;
      for(let c = 0; c < CFG.CARS; c++){
        const v = pref(c);
        for(let s = 0; s < CFG.SUBS; s++){
          total++;
          if(AdminPanel._hasTime(d, v, s)) filled++;
        }
      }
      const batch = d['batch_v0'] || '';
      totalFilled += filled; totalCells += total;
      if(batch) batchCount++;
      return { idx, name: S.tabNames[idx] || defaultTabName(idx), filled, total, batch, pct: total ? (filled/total*100).toFixed(0) : 0 };
    });
    let storageSize = 0;
    for(let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      storageSize += k.length + (localStorage.getItem(k) || '').length;
    }
    const storageKB = (storageSize / 1024).toFixed(1);
    const locked = S.locked;

    let html = '';
    html += `<div class="admin-grid-4">`;
    html += `<div class="admin-kpi" style="background:linear-gradient(135deg,#e6f0ff,#d0e4ff);"><div class="num" style="color:#007aff;">${totalFilled}</div><div class="label">已填行 / ${totalCells}</div></div>`;
    html += `<div class="admin-kpi" style="background:linear-gradient(135deg,#e8f8ee,#d0f0dc);"><div class="num" style="color:#34c759;">${batchCount}</div><div class="label">已设批号模板</div></div>`;
    html += `<div class="admin-kpi" style="background:linear-gradient(135deg,#fff4e6,#ffe8cc);"><div class="num" style="color:#ff9500;">${storageKB}<span style="font-size:12px;">KB</span></div><div class="label">本地存储占用</div></div>`;
    html += `<div class="admin-kpi" style="background:linear-gradient(135deg,${locked?'#ffeceb,#ffd6d2':'#f2f2f7,#e0e0e5'});"><div class="num" style="color:${locked?'#ff3b30':'#8e8e93'};">${locked?'🔒':'🔓'}</div><div class="label">${locked?'已锁定':'可编辑'}</div></div>`;
    html += `</div>`;

    html += `<div class="admin-section-title">各模板填充情况（以时间为准）</div>`;
    rows.forEach(r => {
      html += `<div class="admin-stat-card">`;
      html += `<div class="admin-stat-row"><span class="admin-stat-label">${U.esc(r.name)}${r.idx === S.tab ? ' <span style="color:#007aff;font-size:10px;font-weight:bold;">(当前)</span>' : ''}</span><span class="admin-stat-value">${r.filled}/${r.total} · ${r.pct}%</span></div>`;
      html += `<div class="admin-stat-bar"><div class="admin-stat-bar-fill" style="width:${r.pct}%"></div></div>`;
      if(r.batch) html += `<div style="font-size:11px;color:#888;margin-top:4px;">批号：${U.esc(r.batch)}</div>`;
      html += `</div>`;
    });

    $('adminStats').innerHTML = html;
  },
  checkCalculation(){
    const out = [];
    const add = (level, message) => out.push({level, message});
    const templateName = S.tabNames[S.tab] || defaultTabName(S.tab);
    const durEl = $('processTime_v0');
    const rawDur = durEl ? durEl.value.trim() : '';
    const durValid = !rawDur || U.isValidDurationInput(rawDur);
    const dur = rawDur && durValid ? U.toSec(rawDur) : null;
    if(rawDur && !durValid) add('error', '工艺时间格式不正确（小时 0-23，分钟和秒 0-59）：' + rawDur);
    if(!rawDur && S.tab < 4) add('info', '工艺时间为空，自动推算无法进行。');
    for(let c=0;c<CFG.CARS;c++){
      const v=pref(c);
      const groups=new Map();
      for(let s=0;s<CFG.SUBS;s++){
        const titleEl=$(`title_${v}_s${s}_i1`);
        const timeEl=$(`start_${v}_s${s}_i1`);
        if(!titleEl || !timeEl) continue;
        const title=titleEl.value.trim();
        const raw=timeEl.value.trim();
        if(raw && !U.isValidClockInput(raw)) add('error', `${CFG.CAR_NAMES[c]} · 第${s+1}位：时间格式错误「${raw}」`);
        if(title && raw){
          if(!groups.has(title)) groups.set(title,[]);
          const abs=Scheduler.absSecOf(raw);
          if(abs!==null) groups.get(title).push({s,raw,abs,manual:Flags.isManualStart(c,s)});
        }
      }
      groups.forEach((items,title)=>{
        // Scheduler's normal order is backward: larger slot index is processed first.
        items.sort((a,b)=>b.s-a.s);
        const seen=new Map();
        items.forEach(it=>{
          if(seen.has(it.raw)) add('warn', `${CFG.CAR_NAMES[c]} · 「${title}」存在重复时间 ${it.raw}（第${seen.get(it.raw)+1}位、第${it.s+1}位）`);
          else seen.set(it.raw,it.s);
        });
        for(let i=1;i<items.length;i++){
          const prev=items[i-1], cur=items[i];
          if(cur.abs<=prev.abs) add('warn', `${CFG.CAR_NAMES[c]} · 「${title}」时间顺序可能倒退：第${prev.s+1}位 ${prev.raw} → 第${cur.s+1}位 ${cur.raw}`);
          if(dur!==null && !cur.manual){
            const boundary=U.shiftBoundary(prev.abs);
            if(boundary!==null && prev.abs+dur>=boundary){
              add('warn', `${CFG.CAR_NAMES[c]} · 「${title}」第${cur.s+1}位仍有自动时间 ${cur.raw}，但前一位按工艺时间推算将到达/超过班次截止点；请复核`);
            }
          }
        }
      });
    }
    const box=$('calculationCheckResults');
    if(!box) return;
    if(!out.length){
      box.innerHTML='<div class="admin-stat-card" style="border-color:#34c759;color:#218838;">未发现明显的时间格式、重复时间、顺序倒退或班次截止异常。此检查不能替代现场工艺核对。</div>';
      return;
    }
    const label={error:'错误',warn:'需复核',info:'提示'};
    const colors={error:'#ff3b30',warn:'#ff9500',info:'#007aff'};
    box.innerHTML=`<div class="admin-stat-card"><div style="font-weight:bold;margin-bottom:8px;">${U.esc(templateName)}：发现 ${out.length} 项待检查</div>`+out.map(item=>`<div style="padding:7px 0;border-top:1px solid #eee;font-size:12px;line-height:1.5;"><span style="font-weight:bold;color:${colors[item.level]};">[${label[item.level]}]</span> ${U.esc(item.message)}</div>`).join('')+'</div>';
  },
  renderTemplateList(){
    let html = '';
    S.data.forEach((d, idx) => {
      let filled = 0;
      for(let c = 0; c < CFG.CARS; c++){
        const v = pref(c);
        for(let s = 0; s < CFG.SUBS; s++){
          if(AdminPanel._hasTime(d, v, s)) filled++;
        }
      }
      html += `<div class="admin-template-row">`;
      html += `<div><div class="name">${U.esc(S.tabNames[idx] || defaultTabName(idx))}</div><div class="info">${filled} 条时间数据</div></div>`;
      html += `<button data-action="admin-clear-template" data-idx="${idx}">清空</button>`;
      html += `</div>`;
    });
    $('adminTemplateList').innerHTML = html;
  },
  fillSettings(){
    $('settingCarWidthDesktop').value = localStorage.getItem(CFG.KEY.W_DESKTOP) || '';
    $('settingCarWidthMobile').value = localStorage.getItem(CFG.KEY.W_MOBILE) || '';
    $('settingItemHeight').value = localStorage.getItem(CFG.KEY.ITEM_H) || '';
    $('settingMissingTimeHighlight').checked = localStorage.getItem('luotong_missing_time_highlight_v1') !== 'false';
    $('newPassword').value = '';
    $('confirmPassword').value = '';
    const btn = $('lockToggleBtn');
    if(btn){
      btn.textContent = S.locked ? '🔓 解锁系统' : '🔒 锁定系统';
      btn.className = 'admin-btn ' + (S.locked ? 'success' : 'danger');
    }
  },
  /* 导出全部模板数据为备份 JSON */
  exportAll(){
    Store.flush();
    const backup = {
      app: '满卷时间计算工具',
      version: 'v1.38',
      type: 'full',
      exportTime: new Date().toISOString(),
      data: S.data,
      tabNames: S.tabNames.slice(0, 4),
      batchOpts: S.batchOpts,
      batchDeniers: S.batchDeniers,
      batchPT: S.batchPT,
      batchCounts: S.batchCounts,
      faultRecords: localStorage.getItem('luotong_fault_records_v1') || '[]',
      faultReasons: localStorage.getItem('luotong_fault_reasons_v1') || '[]',
      settings: {
        wDesktop: localStorage.getItem(CFG.KEY.W_DESKTOP),
        wMobile: localStorage.getItem(CFG.KEY.W_MOBILE),
        itemH: localStorage.getItem(CFG.KEY.ITEM_H)
      }
    };
    AdminPanel._download(backup, '满卷备份_全部_');
  },
  /* 导出当前模板数据为备份 JSON */
  exportCurrent(){
    Store.flush();
    const backup = {
      app: '满卷时间计算工具',
      version: 'v1.38',
      type: 'single',
      templateIndex: S.tab,
      templateName: S.tabNames[S.tab] || defaultTabName(S.tab),
      exportTime: new Date().toISOString(),
      data: S.data[S.tab]
    };
    AdminPanel._download(backup, `满卷_${(S.tabNames[S.tab] || defaultTabName(S.tab)).replace(/[\\/:*?"<>|]/g,'_')}_`);
  },
  _download(obj, prefix){
    const blob = new Blob([JSON.stringify(obj, null, 2)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const ts = new Date();
    const stamp = `${ts.getFullYear()}${String(ts.getMonth()+1).padStart(2,'0')}${String(ts.getDate()).padStart(2,'0')}_${String(ts.getHours()).padStart(2,'0')}${String(ts.getMinutes()).padStart(2,'0')}`;
    a.download = `${prefix}${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  },
  triggerImport(){ $('importFileInput').click(); },
  handleImportFile(file){
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const backup = JSON.parse(ev.target.result);
        if(!backup.data) throw new Error('文件中缺少 data 字段');

        if(backup.type === 'single' || backup.templateIndex !== undefined){
          const idx = +backup.templateIndex;
          if(idx < 0 || idx >= CFG.TEMPLATES) throw new Error('模板索引无效');
          Modals.askConfirm('导入单模板数据',
            `将导入到「${S.tabNames[idx] || defaultTabName(idx)}」并覆盖现有数据。\n确定导入吗？`).then(ok => {
            if(!ok) return;
            AdminPanel._download({app:'落筒录入同步恢复备份',type:'recovery',exportTime:new Date().toISOString(),localStorage:Object.fromEntries(Array.from({length:localStorage.length},(_,i)=>localStorage.key(i)).filter(k=>k!==null).map(k=>[k,localStorage.getItem(k)]))}, '导入前自动恢复备份_');
            S.data[idx] = backup.data;
            Store.save();
            showToast('导入成功，正在刷新','ok');
            setTimeout(function(){location.reload()},900);
          });
        } else if(Array.isArray(backup.data) && backup.data.length === CFG.TEMPLATES){
          Modals.askConfirm('导入全部数据',
            `将覆盖所有模板的数据和批号配置，当前数据会丢失。\n确定导入吗？`).then(ok => {
            if(!ok) return;
            AdminPanel._download({app:'落筒录入同步恢复备份',type:'recovery',exportTime:new Date().toISOString(),localStorage:Object.fromEntries(Array.from({length:localStorage.length},(_,i)=>localStorage.key(i)).filter(k=>k!==null).map(k=>[k,localStorage.getItem(k)]))}, '导入前自动恢复备份_');
            S.data = backup.data;
            if(Array.isArray(backup.tabNames)){
              for(let t = 0; t < 4; t++){
                const v = backup.tabNames[t];
                S.tabNames[t] = (typeof v === 'string' && v.trim()) ? v.trim() : defaultTabName(t);
              }
              Store.saveTabNames();
            }
            S.batchOpts = backup.batchOpts || [];
            S.batchDeniers = backup.batchDeniers || {};
            S.batchPT = backup.batchPT || {};
            S.batchCounts = backup.batchCounts || {};
            if(backup.settings){
              if(backup.settings.wDesktop != null) localStorage.setItem(CFG.KEY.W_DESKTOP, backup.settings.wDesktop); else localStorage.removeItem(CFG.KEY.W_DESKTOP);
              if(backup.settings.wMobile != null) localStorage.setItem(CFG.KEY.W_MOBILE, backup.settings.wMobile); else localStorage.removeItem(CFG.KEY.W_MOBILE);
              if(backup.settings.itemH != null) localStorage.setItem(CFG.KEY.ITEM_H, backup.settings.itemH); else localStorage.removeItem(CFG.KEY.ITEM_H);
            }
            Store.save();
            Store.saveBatchOpts(); Store.saveBatchDeniers(); Store.saveBatchPT(); Store.saveBatchCounts();
            if(backup.faultRecords != null) localStorage.setItem('luotong_fault_records_v1', typeof backup.faultRecords === 'string' ? backup.faultRecords : JSON.stringify(backup.faultRecords));
            if(backup.faultReasons != null) localStorage.setItem('luotong_fault_reasons_v1', typeof backup.faultReasons === 'string' ? backup.faultReasons : JSON.stringify(backup.faultReasons));
            showToast('导入成功，正在刷新','ok');
            setTimeout(function(){location.reload()},900);
          });
        } else {
          throw new Error('无法识别的文件格式');
        }
      } catch(err) {
        showToast('导入失败：' + err.message,'err');
      }
    };
    reader.readAsText(file);
  },
  clearOneTemplate(idx){
    if(idx < 0 || idx >= CFG.TEMPLATES) return;
    Modals.askConfirm('清空模板',
      `确定清空「${S.tabNames[idx] || defaultTabName(idx)}」的所有数据吗？\n此操作不可恢复。`).then(ok => {
      if(!ok) return;
      S.data[idx] = {};

          }
        }
      }

  saveLayout(){

    localStorage.setItem(CFG.KEY.W_MOBILE, $('settingCarWidthMobile').value);

    showToast('设置已保存，正在刷新','ok');

  changePassword(){

    const r = AdminPassword.set(np);
    if(!r.ok){ showToast(r.msg,'err'); return; }
    $('newPassword').value = '';
    $('confirmPassword').value = '';

const Events = {
  _lastWheel: 0,
  _resizeTimer: null,
  _lastTabClick: null,
  init(){
    document.addEventListener('click', Events.onClick);
    document.addEventListener('input', Events.onInput);
    document.addEventListener('change', Events.onChange);
    document.addEventListener('blur', Events.onBlur, true);
    document.addEventListener('focusin', Events.onFocusIn);
    document.addEventListener('focusout', Events.onFocusOut);
    document.addEventListener('keydown', Events.onKeyDown, true);
    $('main_content').addEventListener('wheel', Events.onWheel, {passive: false});
    window.addEventListener('resize', Events.onResize);
    window.addEventListener('orientationchange', Events.onResize);
    if(window.visualViewport){
      window.visualViewport.addEventListener('resize', Events.onViewportResize, {passive:true});
      window.visualViewport.addEventListener('scroll', Events.onViewportResize, {passive:true});
    }
    window.addEventListener('beforeunload', () => Store.flush());
  },
  onClick(e){
    const t = e.target.closest('[data-action]');
    if(!t) return;
    const a = t.dataset.action;

    if(a === 'switch-tab'){
      const idx = +t.dataset.index;
      const now = Date.now();
      if(Events._lastTabClick
        && Events._lastTabClick.idx === idx
        && now - Events._lastTabClick.time < 420){
        Events._lastTabClick = null;
        if(idx < 4){ Events.renameTab(idx); return; }
      }
      Events._lastTabClick = { idx, time: now };
      App.switchTab(idx);
      return;
    }

    switch(a){
      case 'open-log': Modals.openLog(); break;
      case 'open-reset': if(!S.locked) Modals.open('resetModal'); break;
      case 'open-login': Modals.openLogin(); break;
      case 'reset-current': Modals.close('resetModal'); App.resetCurrent(); break;
      case 'reset-all': Modals.close('resetModal'); App.resetAll(); break;
      case 'batch-add-ok': Modals.submitBatchAdd(); break;
      case 'batch-add-cancel': Modals.close('batchAddModal'); break;
      case 'toggle-lock': AdminPanel.toggleLock(); break;
      case 'check-password': Auth.check(); break;
      case 'clear-all-data':
        Modals.askConfirm('清空所有数据', '确定清空所有本地数据吗？\n包括所有模板、批号、密码和排版设置。此操作不可恢复。').then(ok => {
          if(ok){ localStorage.clear(); location.reload(); }
        });
        break;
      case 'close-modal': Modals.close(t.dataset.modal); break;
      case 'confirm-modal-ok': if(Modals._confirmOk) Modals._confirmOk(); break;
      case 'confirm-modal-cancel': if(Modals._confirmCancel) Modals._confirmCancel(); break;
      case 'toggle-empty-slot': App.toggleEmptySlot(+t.dataset.car); break;
      case 'toggle-car-lock': CarLock.toggle(+t.dataset.car); break;
      case 'goto-remark': App.gotoRemark(+t.dataset.car); break;
      case 'scroll-cars': App.scrollCars(+t.dataset.dir); break;
      case 'toggle-collapse': App.toggleCollapse(t); break;
      case 'toggle-opt': App.toggleOpt(t); break;
      case 'toggle-count': e.preventDefault(); App.toggleCount(t.dataset.car); break;
      case 'clear-card': App.clearCard(+t.dataset.car, +t.dataset.s, +t.dataset.i); break;
      case 'switch-admin-tab': AdminPanel.switchTab(t.dataset.tab); break;
      case 'admin-export-all': AdminPanel.exportAll(); break;
      case 'admin-check-calculation': AdminPanel.checkCalculation(); break;
      case 'admin-export-current': AdminPanel.exportCurrent(); break;
      case 'admin-import': AdminPanel.triggerImport(); break;
      case 'admin-clear-template': AdminPanel.clearOneTemplate(+t.dataset.idx); break;
      case 'admin-save-layout': AdminPanel.saveLayout(); break;
      case 'admin-change-pwd': AdminPanel.changePassword(); break;
    }
  },
  renameTab(idx){
    if(idx < 0 || idx >= 4) return;
    if(S.locked){ showToast('系统已锁定，无法修改模板名称','err'); return; }
    const def = defaultTabName(idx);
    const cur = S.tabNames[idx] || def;
    const input = prompt(`修改「${def}」名称：\n（留空则恢复默认「${def}」）`, cur);
    if(input === null) return;
    const nv = String(input).trim();
    S.tabNames[idx] = nv ? nv : def;
    Store.saveTabNames();
    Renderer.initTabs();
    Renderer.updateActiveTab();
  },
  onInput(e){
    const el = e.target;
    const role = el.dataset.role;
    AutoSize.byId(el);
    if(role === 'batch') return;
    if(S.locked) return;
    if(role === 'start'){
      el._dirty = true;
      delete T()[fk.autoFill(+el.dataset.car, +el.dataset.s)];
      Sync.rowToB_F(pref(+el.dataset.car), +el.dataset.s, true);
      return;
    }
    if(role === 'title'){ Events.onTitleInput(el); return; }
    if(role === 'row'){ Sync.rowToB_F(pref(+el.dataset.car), +el.dataset.s, true); Store.saveDebounced(); return; }
    if(role === 'header'){ Events.onHeaderInput(el); return; }
  },
  onTitleInput(el){
    const c = +el.dataset.car, s = +el.dataset.s;
    const v = pref(c);
    delete T()[fk.autoFill(c, s)];
    if(c === 0){ syncTitleFromV0(el.value, s); }
    else {
      const v0El = $(`title_v0_s${s}_i1`);
      const v0Val = v0El ? v0El.value.trim() : '';
      Flags.titleCustom(c, s, v0Val !== el.value.trim());
      Sync.titles(v, s);
    }
    if(!isManualOnlyTab()) Scheduler.updateFromDebounced(c);
    Store.saveDebounced();
    updateTitleCustomMarks();
  },
  onHeaderInput(el){
    const field = el.dataset.field;
    const id = el.id || '';
    const m = id.match(/^[a-zA-Z_]+_v(\d+)/);
    const carIdx = m ? +m[1] : -1;
    if(field === 'processTime' && carIdx === 0){
      syncHeaderFieldFromV0('processTime', el.value);
      if(!isManualOnlyTab()) Scheduler.updateFromDebounced(0);
      Store.saveDebounced();
      return;
    }
    if((field === 'series1' || field === 'series2') && carIdx === 0){
      syncHeaderFieldFromV0(field, el.value); Store.saveDebounced(); return;
    }
    if(field === 'denier' && carIdx === 0){
      syncHeaderFieldFromV0('denier', el.value); Store.saveDebounced(); return;
    }
    if(field === 'headerName' && carIdx === 0){
      syncHeaderFieldFromV0('headerName', el.value); Store.saveDebounced(); return;
    }
    if(field === 'count'){ updateCountWarnings(); }
    Store.saveDebounced();
  },
  onChange(e){
    if(e.target.dataset.role === 'batch') Batch.handleChange(e.target);
  },
  onBlur(e){
    const el = e.target;
    AutoSize.byId(el);
    const role = el.dataset.role;
    if(S.locked) return;
    if(role === 'start'){ Events.onStartBlur(el); return; }
    if(role === 'title'){ Events.onTitleBlur(el); return; }
    if(role === 'header'){
      if(el.dataset.field === 'processTime' && el.id === 'processTime_v0'){
        const beforePT = el.value;
        const raw = el.value.trim();
        if(raw && !U.isValidDurationInput(raw)){
          showToast('时间错误：小时须在 0-23 之间，分钟和秒须在 0-59 之间。','err');
          el.value = '';
        } else {
          el.value = U.autoFormatDuration(raw);
        }
        syncHeaderFieldFromV0('processTime', el.value);
        // 只有工艺时间真的变了才重算；点进点出不改内容不触发
        if(beforePT !== el.value && !isManualOnlyTab()){ Scheduler.updateFrom(0); }
        AutoSize.allHeaders();
      }
      Store.save();
      return;
    }
    if(role === 'remark' || role === 'row') Store.save();
  },
  onStartBlur(el){
    if(el.readOnly) return;
    const before = el.value;
    const raw = el.value.trim();
    if(raw && !U.isValidClockInput(raw)){
      showToast('时间错误：小时须在 0-23 之间，分钟须在 0-59 之间。','err');
      el.value = '';
    } else {
      el.value = U.autoFormat(raw);
    }
    const touched = !!el._dirty;
    if(el._dirty){
      const v = el.value.trim();
      const c = +el.dataset.car, s = +el.dataset.s;
      if(v && U.toSec(v) !== null){ Flags.manualStart(c, s, true); Flags.manualClear(c, s, false); }
      else { Flags.manualStart(c, s, false); Flags.manualClear(c, s, true); }
      el._dirty = false;
    }
    // 只有真的改动过内容才重算；点进点出、没改东西不触发
    const changed = touched || before !== el.value;
    if(changed && !isManualOnlyTab()) Scheduler.updateFrom(+el.dataset.car);
  },
  onTitleBlur(el){
    if(el.readOnly) return;
    const c = +el.dataset.car, s = +el.dataset.s;
    const formatted = U.formatTitle(el.value);
    if(formatted === el.value) return;
    el.value = formatted;
    if(c === 0){ syncTitleFromV0(formatted, s); }
    else { Sync.titles(pref(c), s); }
    if(!isManualOnlyTab()) Scheduler.updateFrom(c);
    updateTitleCustomMarks();
    Store.save();
  },
  onFocusIn(e){
    const el = e.target;
    if(el.classList && el.classList.contains('calc-input') && !el.readOnly){
      setTimeout(() => { try{ el.select(); }catch(_e){} }, 10);
    }
    if(window.innerWidth < 768){
      if(S.kbOpen) return;
      if(!U.isEditable(el)) return;
      S.kbOpen = true;
      document.body.classList.add('keyboard-open');
      const container = $('main_content');
      if(container){
        S.preKbH = container.clientHeight;
        container.style.overflowAnchor = 'none';
      }
      // 等手机键盘完成弹出后，按可视区域缩小内容区，并把当前输入框滚动到可见位置。
      [120, 300, 500].forEach(delay => setTimeout(() => Events.keepFocusedInputVisible(el), delay));
    }
  },
  keepFocusedInputVisible(el){
    if(!el || document.activeElement !== el || !U.isEditable(el)) return;
    const container = $('main_content');
    if(container && window.visualViewport && S.kbOpen){
      const rect = container.getBoundingClientRect();
      const visibleBottom = window.visualViewport.height + window.visualViewport.offsetTop;
      const available = Math.max(160, visibleBottom - rect.top - 8);
      container.style.height = available + 'px';
    }
    // 手机端不要调用 element.scrollIntoView()：它可能滚动整个文档，
    // 导致当前车辆输入时上一辆车被带入视野。只在主内容滚动容器内做最小调整。
    setTimeout(() => {
      if(document.activeElement !== el) return;
      const c = $('main_content');
      if(!c) return;
      const r = el.getBoundingClientRect();
      const cr = c.getBoundingClientRect();
      const vv = window.visualViewport;
      const bottom = vv ? Math.min(cr.bottom, vv.height + vv.offsetTop) : Math.min(cr.bottom, window.innerHeight);
      const top = Math.max(cr.top, 4);
      if(r.bottom > bottom - 12){
        c.scrollTop += Math.min(r.bottom - bottom + 18, Math.max(0, c.scrollHeight - c.clientHeight));
      } else if(r.top < top + 4){
        c.scrollTop -= Math.min(top + 4 - r.top, c.scrollTop);
      }
    }, 80);
  },
  onViewportResize(){
    if(!S.kbOpen) return;
    const el = document.activeElement;
    if(U.isEditable(el)) Events.keepFocusedInputVisible(el);
  },
  onFocusOut(e){
    if(window.innerWidth >= 768) return;
    if(!U.isEditable(e.target)) return;
    setTimeout(() => {
      if(U.isEditable(document.activeElement)) return;
      if(!S.kbOpen) return;
      S.kbOpen = false;
      document.body.classList.remove('keyboard-open');
      const container = $('main_content');
      if(container){ container.style.height = ''; container.style.overflowAnchor = ''; }
      Layout.adjustCarHeightsThrottled();
    }, 120);
  },
  onKeyDown(e){
    const t = e.target;
    if(!t) return;
    if(t.id === 'batchAddName' || t.id === 'batchAddDenier' || t.id === 'batchAddPT' || t.id === 'batchAddCount'){
      if(e.key === 'Enter'){ e.preventDefault(); Modals.submitBatchAdd(); }
      return;
    }
    if(t.id === 'adminPassword' && e.key === 'Enter'){
      e.preventDefault(); Auth.check(); return;
    }
    if(!t.classList || !t.classList.contains('calc-input')) return;
    if(e.key !== 'Enter' && e.keyCode !== 13 && e.which !== 13) return;
    if(e.isComposing || e.keyCode === 229) return;
    if(t.tagName === 'TEXTAREA' || t.readOnly || t.disabled) return;
    const id = t.id || '';
    // 工艺时间按回车时执行失焦校验与格式化，不把回车吞掉。
    if(/^processTime_v\d+$/.test(id)){
      e.preventDefault();
      t.blur();
      return;
    }
    let m, targetId = null;
    if((m = id.match(/^start_(v\d+)_s(\d+)_i1$/))) targetId = Events.nextRowId('start', m[1], +m[2]);
    else if((m = id.match(/^train_(v\d+)_s(\d+)_i1$/))) targetId = 'shift_' + m[1] + '_s' + m[2] + '_i1';
    else if((m = id.match(/^shift_(v\d+)_s(\d+)_i1$/))) targetId = Events.nextRowId('train', m[1], +m[2]);
    else return;
    e.preventDefault();
    if(!targetId){ t.blur(); return; }
    const next = $(targetId);
    if(!next || next.disabled || next.readOnly){ t.blur(); return; }
    const block = next.closest ? next.closest('.car-block') : null;
    if(block && block.classList.contains('collapsed')){
      block.classList.remove('collapsed');
      const btn = block.querySelector('.toggle-btn');
      if(btn) btn.textContent = '折叠';
      T()[`collapse_${block.id}`] = false;
      Store.saveDebounced();
      Layout.adjustCarHeightsThrottled();
    }
    next.focus();
    if(block){
      const container = $('main_content');
      if(container){
        const top = block.offsetTop - container.offsetTop;
        requestAnimationFrame(() => {
          if(Math.abs(container.scrollTop - top) > 8) container.scrollTop = top;
        });
      }
    }
    if(window.innerWidth >= 768 && next.select){
      setTimeout(() => { try{ next.select(); }catch(_e){} }, 0);
    }
  },
  nextRowId(kind, vPrefix, sIdx){
    if(sIdx + 1 < CFG.SUBS) return `${kind}_${vPrefix}_s${sIdx+1}_i1`;
    return null;
  },
  onWheel(e){
    if(window.innerWidth < 768) return;
    if(U.isEditable(e.target)) return;
    if(Math.abs(e.deltaY) < 4) return;
    e.preventDefault();
    const now = Date.now();
    if(now - Events._lastWheel < 90) return;
    Events._lastWheel = now;
    App.scrollCars(e.deltaY > 0 ? 1 : -1);
  },
  onResize(){
    clearTimeout(Events._resizeTimer);
    Events._resizeTimer = setTimeout(() => {
      if(!S.kbOpen) Layout.adjustCarHeightsThrottled();
      AutoSize.allHeaders();
    }, 150);
  }
};

function installFaultTemplateTab(){
  const tabs = document.getElementById('main-tabs');

  const panel = document.createElement('div');
  panel.id = 'fault-template-panel';
  panel.style.cssText = 'display:none;height:calc(100vh - 52px);height:calc(100dvh - 52px);overflow:hidden;background:#f3f5f9;';
  const frame = document.createElement('iframe');
  frame.title = '落筒故障录入';
  frame.style.cssText = 'display:block;width:100%;height:100%;border:0;background:#f3f5f9;';
  frame.setAttribute('sandbox','allow-scripts allow-forms allow-same-origin allow-modals');
  frame.srcdoc = FAULT_TEMPLATE_HTML;
  panel.appendChild(frame);
  const main = document.getElementById('main-contents');
  main.parentNode.insertBefore(panel, main.nextSibling);
  document.addEventListener('click', function(e){
    const clickedTab = e.target.closest('.main-tab');
    if(clickedTab && clickedTab.id !== 'fault-template-tab'){
      panel.style.display = 'none';
      main.style.display = '';
      tab.classList.remove('active');
    }
  }, true);
}
function openFaultTemplate(){
  const panel = document.getElementById('fault-template-panel');
  const main = document.getElementById('main-contents');
  const tab = document.getElementById('fault-template-tab');
  if(!panel || !main || !tab) return;
  main.style.display = 'none';
  panel.style.display = 'block';
  document.querySelectorAll('#main-tabs .main-tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
}

/* 车头栏个数低于当前批号预设个数时标红：预设为纯数字才比较，空值不标红 */
function updateCountWarnings(){
  var preset = S.currentBatch ? String(S.batchCounts[S.currentBatch] === undefined ? '' : S.batchCounts[S.currentBatch]).trim() : '';
  var limit = /^\d+$/.test(preset) ? parseInt(preset, 10) : null;
  for(var c = 0; c < CFG.CARS; c++){
    var el = $('count_v' + c);
    if(!el) continue;
    var raw = String(el.value || '').trim();
    var low = false;
    if(limit !== null && /^\d+$/.test(raw)){
      low = parseInt(raw, 10) < limit;
    }
    el.classList.toggle('count-low', low);
  }
}

/* 位号标红：与默认编号不一致时整排位号显示红色；无默认编号的模板不标红 */
function updateTitleCustomMarks(){
  if(S.tab > 3){
    for(var c0 = 0; c0 < CFG.CARS; c0++){
      for(var s0 = 0; s0 < CFG.SUBS; s0++){
        for(var i0 = 1; i0 <= 6; i0++){
          var e0 = $('title_v' + c0 + '_s' + s0 + '_i' + i0);
          if(e0) e0.classList.remove('title-custom');
        }
      }
    }
    return;
  }
  for(var c = 0; c < CFG.CARS; c++){
    for(var s = 0; s < CFG.SUBS; s++){
      var base = $('title_v' + c + '_s' + s + '_i1');
      var want = String((6 - s + S.tab * 6) + '#').replace(/#+$/, '');
      var val = base ? String(base.value || '').trim().replace(/#+$/, '') : '';
      var custom = val !== '' && val !== want;
      for(var i = 1; i <= 6; i++){
        var el = $('title_v' + c + '_s' + s + '_i' + i);
        if(el) el.classList.toggle('title-custom', custom);
      }
    }
  }
}
function boot(){
  Layout.apply();
  setTimeout(() => {
    Store.loadTabNames();
    Renderer.initTabs();
    installFaultTemplateTab();
    Renderer.initCars();
    Renderer.initGrids();

    Store.loadBatch();
    Batch.refreshSelects();
    Batch.applyAll('', true, true, true);

    Store.load();
    for(let t = 0; t < CFG.TEMPLATES; t++){
      if(!S.data[t]) S.data[t] = {};
      if(S.data[t].globalDirection === undefined) S.data[t].globalDirection = 'backward';
    }

    S.locked = localStorage.getItem(CFG.KEY.LOCKED) === 'true';

    Events.init();
    App.loadTab();

    for(let c = 0; c < CFG.CARS; c++){
      for(let s = 0; s < CFG.SUBS; s++) Sync.titles(pref(c), s);
    }

    Renderer.updateEmptySlotBtns();
    // 首次加载不重算：直接呈现上次保存的时间与空位结果，只有工艺时间、位号、开始时间变动或点空位填充时才重算
    Store.flush();
    Auth.applyLockState();
    Layout.adjustCarHeights();
    AutoSize.allHeaders();

    const mask = $('loading-mask');
    if(mask){
      mask.classList.add('hidden');
      setTimeout(() => mask.remove(), 300);
    }
  }, 50);
}

// 车次仅在按回车时拆分；不在输入过程中自动处理。
function splitTrainOnEnter(input){
  const m = input.id.match(/^train_(v\d+)_s(\d+)_i(\d+)$/);
  if(!m) return false;
  const raw = String(input.value || '').trim();
  const shift = document.getElementById('shift_' + m[1] + '_s' + m[2] + '_i' + m[3]);
  // 当前车最下面一排回车后只失焦，不跳到下一车；其他排跳到下一个位号车次框。
  const sameCarTrainInputs = Array.from(document.querySelectorAll('input[id^="train_"]'))
    .map(el => ({el, match: el.id.match(/^train_(v\d+)_s(\d+)_i(\d+)$/)}))
    .filter(item => item.match && item.match[1] === m[1] && item.match[3] === m[3])
    .map(item => Number(item.match[2]));
  const maxRowIndex = sameCarTrainInputs.length ? Math.max(...sameCarTrainInputs) : -1;
  const isLastRow = Number(m[2]) === maxRowIndex;
  if(!raw){
    if(isLastRow) input.blur();
    else focusNextTrainInput(input);
    return true;
  }
  if(!/^\d+$/.test(raw)){
    input.value = '';
    if(shift) shift.value = '';
    Store.saveDebounced();
    showToast('车次输入不合法，请输入数字','err');
    input.focus();
    return true;
  }
  const finalTrain = raw.slice(0, -1);
  const last = Number(raw.slice(-1));
  if(!Number.isInteger(last) || last < 1 || last > 4){
    clearInvalidTrain(input, shift, '班次不合法，仅支持1-4的班次值');
    return true;
  }
  if(finalTrain !== ''){
    const trainNumber = Number(finalTrain);
    if(!Number.isInteger(trainNumber) || trainNumber < 1 || trainNumber > 15){
      clearInvalidTrain(input, shift, '拆分后的车次不合法，请输入1-15范围内的车次');
      return true;
    }
  }
  if(shift) shift.value = String(last);
  input.value = finalTrain;
  Store.saveDebounced();
  // 当前车最下面一排拆分完成后失焦；不跳到下一车。其他排跳到下一个位号车次框。
  if(isLastRow) input.blur();
  else focusNextTrainInput(input);
  return true;
}
function focusNextTrainInput(currentInput){
  // 按页面 DOM 顺序跳到下一个位号的车次输入框，不跳到当前位号的其他字段。
  const all = Array.from(document.querySelectorAll('input[id^="train_"]'))
    .filter(el => !el.disabled && !el.readOnly && el.type !== 'hidden');
  const currentIndex = all.indexOf(currentInput);
  if(currentIndex < 0) return;
  const next = all[currentIndex + 1];
  if(next){
    next.focus({preventScroll:false});
    try{ next.select(); }catch(_e){}
    if(typeof Events !== 'undefined' && Events.keepFocusedInputVisible) Events.keepFocusedInputVisible(next);
  }else{
    currentInput.focus();
  }
}
function clearInvalidTrain(input, shift, message){
  input.value = '';
  if(shift) shift.value = '';
  Store.saveDebounced();
  showToast(message,'err');
  input.focus();
}
function focusNextOccupiedTrain(currentInput){
  // 合法拆分后直接跳到 DOM 顺序中的下一个可编辑位号车次输入框，不检查内容。
  setTimeout(function(){
    const all = Array.from(document.querySelectorAll('input[id^="train_"]'));
    const currentIndex = all.indexOf(currentInput);
    if(currentIndex < 0) return;
    for(let i=currentIndex+1; i<all.length; i++){
      const candidate = all[i];
      if(candidate.disabled || candidate.readOnly) continue;
      candidate.focus({preventScroll:false});
      try{ candidate.select(); }catch(_e){}
      if(typeof Events !== 'undefined' && Events.keepFocusedInputVisible) Events.keepFocusedInputVisible(candidate);
      return;
    }
  }, 80);
}
// 使用捕获阶段拦截车次输入框的回车：拆分后跳到下一个位号的车次输入框。
document.addEventListener('keydown', function(e){
  const input = e.target;
  if(e.key !== 'Enter' && e.keyCode !== 13 && e.which !== 13) return;
  if(e.isComposing || e.keyCode === 229) return;
  if(!input || !input.id || !/^train_v\d+_s\d+_i\d+$/.test(input.id)) return;
  if(input.readOnly || input.disabled) return;
  e.preventDefault();
  e.stopImmediatePropagation();
  splitTrainOnEnter(input);
}, true);

boot();
})();
(function(){
  var el=document.getElementById('ui-js');
  if(!el) return;
  try{ (new Function(el.textContent))(); }catch(e){ console.error('[ui-js]', e); }
})();
